# The editor uses a compact house form that puts short clauses on one line
# (`if x: return`). That is left as-is. This gate keeps the checks that flag a
# real defect - E4/E7/E9 syntax errors, and F undefined names, unused imports
# and unused variables - and deliberately leaves E701/E702 off.
[lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E701", "E702"]
